# 修改下面三个 change-me 后执行：docker compose up -d
# 密钥生成：openssl rand -hex 32；CONFIG_ENCRYPTION_KEY 必须是 64 位十六进制，生成后不要更换
services:
  app:
    image: sunqz/shop-cashback:latest
    ports:
      - "8081:3001"
    environment:
      DATABASE_URL: postgresql://rebate:change-me-db@postgres:5432/rebate
      JWT_SECRET: change-me-至少32位的随机字符串
      CONFIG_ENCRYPTION_KEY: change-me-64位十六进制
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rebate
      POSTGRES_USER: rebate
      POSTGRES_PASSWORD: change-me-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U rebate
      interval: 5s
    restart: unless-stopped

volumes:
  pgdata:
