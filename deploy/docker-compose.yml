# 单容器部署：docker compose up -d，然后打开 http://服务器IP:8081
# 所有数据（内置数据库、JWT 与配置加密密钥、更新记录）都在同级目录 ./data，备份或迁移时复制这个目录即可
# 后台「系统设置 → 版本更新」可一键更新，需要挂载 docker.sock；不需要可删掉那一行
services:
  app:
    image: sunqz/shop-cashback:latest
    container_name: shop-cashback
    environment:
      UPDATE_CONTAINER: shop-cashback   # 一键更新时用于识别本容器，需与 container_name 一致
      # PROXY_HOST: http://192.168.5.199:7890   # 可选：境外请求代理（Docker Hub 版本查询与一键更新下载、Telegram）及喵有券接口（需固定出口 IP 过白名单），mihomo 需开启 allow-lan
    ports:
      - "8081:3001"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
