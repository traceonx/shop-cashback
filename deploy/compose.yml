name: shihui
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  server:
    image: ${SERVER_IMAGE:-shop-cashback-server:local}
    logging: *logging
    stop_grace_period: 30s
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    environment:
      DATABASE_URL: postgresql://rebate:${POSTGRES_PASSWORD}@postgres:5432/rebate
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  admin:
    image: ${ADMIN_IMAGE:-shop-cashback-admin:local}
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: admin
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    logging: *logging
    image: caddy:2-alpine
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - admin
    restart: unless-stopped
  postgres:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rebate
      POSTGRES_USER: rebate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rebate -d rebate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    logging: *logging
    image: redis:7-alpine
    profiles: [infrastructure]
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
