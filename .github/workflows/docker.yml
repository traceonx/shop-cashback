name: Docker 镜像

# 推送到 main 或打 v* 标签时构建 linux/amd64 + linux/arm64 镜像并推送到 Docker Hub。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   Variables: DOCKERHUB_USERNAME  Docker Hub 用户名
#   Secrets:   DOCKERHUB_TOKEN     Docker Hub Access Token（Read & Write）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Docker Hub 配置
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::请在仓库设置中添加变量 DOCKERHUB_USERNAME 和密钥 DOCKERHUB_TOKEN"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 server 镜像标签
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/shop-cashback-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 生成 admin 镜像标签
        id: admin-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/shop-cashback-admin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 两个 target 共用同一个 build 阶段；同一 job 内第二次构建直接复用缓存。
      - name: 构建并推送 server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=shop-cashback
          cache-to: type=gha,scope=shop-cashback,mode=max

      - name: 构建并推送 admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: admin
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.admin-meta.outputs.tags }}
          labels: ${{ steps.admin-meta.outputs.labels }}
          cache-from: type=gha,scope=shop-cashback

      - name: 输出镜像
        run: |
          {
            echo "### 已推送镜像"
            echo '```'
            echo "${{ steps.server-meta.outputs.tags }}"
            echo "${{ steps.admin-meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
